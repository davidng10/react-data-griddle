name: Verify package

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release SHA; otherwise use the triggering commit
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

# Jobs run in parallel so one push reports every failing layer. Every job checks out the same
# ref, so the tarball `consumers` retains is built from the commit the other jobs verified.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm verify:static

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm verify:unit

  e2e:
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: pnpm verify:e2e
      - name: Retain the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          retention-days: 14
          path: |
            playwright-report/
            test-results/

  consumers:
    name: Packed consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - name: Test packed consumers
        id: consumers
        shell: bash
        run: |
          set -euo pipefail
          pnpm verify:consumers | tee "$RUNNER_TEMP/consumers.log"
          evidence=$(sed -n 's/^Isolated consumers: //p' "$RUNNER_TEMP/consumers.log")
          test -d "$evidence"
          printf 'evidence=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
      - name: Retain the tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-package
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.consumers.outputs.evidence }}/*.tgz
            ${{ steps.consumers.outputs.evidence }}/pack.json
            ${{ steps.consumers.outputs.evidence }}/results.json

  # The single required status check: jobs can be added or renamed without editing branch protection.
  all:
    name: All checks
    if: always()
    needs: [static, unit, e2e, consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
